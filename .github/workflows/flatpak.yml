name: Build Flatpak

on:
  workflow_call:
    inputs:
      IS_RELEASE:
        required: true
        type: boolean

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.3
      options: --privileged
      # Host folders with preinstalled SDKs the flatpak build does not use.
      # They are mounted so the first step can delete them; otherwise the
      # runner disk fills up while flatpak-builder exports the build.
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /usr/local/.ghcup:/host/ghcup
        - /opt/hostedtoolcache/CodeQL:/host/codeql
        - /usr/share/swift:/host/swift
    steps:
    - name: Free disk space
      run: |
        df -h /
        rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/ghcup/* /host/codeql/* /host/swift/*
        df -h /

    - name: Show environment variables
      run: >
        echo IS_RELEASE: ${{ inputs.IS_RELEASE }}

    - name: Checkout repository
      uses: actions/checkout@v7
    # https://stackoverflow.com/questions/60916931/github-action-does-the-if-have-an-else
    - name: Determine flatpak release branch
      uses: haya14busa/action-cond@v1
      id: flatpak_release_branch
      with:
        cond: ${{ inputs.IS_RELEASE }}
        if_true: 'stable'
        if_false: 'development'

    - name: Show Flatpak manifest
      run:  |
        ls -R buildconfig/flatpak/
        cat buildconfig/flatpak/org.tuxemon.Tuxemon.yaml

    - name: Build package
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: Tuxemon.flatpak
        manifest-path: buildconfig/flatpak/org.tuxemon.Tuxemon.yaml
        cache: false
        branch: ${{ steps.flatpak_release_branch.outputs.value }}

    - name: Test Flatpak bundle
      run: |
        flatpak install --user --noninteractive Tuxemon.flatpak
        flatpak run org.tuxemon.Tuxemon -h

    - name: Prepare Flatpak directory
      run: |
        mkdir -p Tuxemon-x86_64
        mv Tuxemon.flatpak Tuxemon-x86_64/

    - name: Upload Flatpak artifact as a folder
      uses: actions/upload-artifact@v4
      with:
        name: Tuxemon-x86_64
        path: Tuxemon-x86_64/

